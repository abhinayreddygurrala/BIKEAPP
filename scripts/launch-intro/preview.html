<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000}#stage{position:relative;width:440px;height:956px;overflow:hidden;background:#0B0B0D;font-family:-apple-system,Helvetica,sans-serif}
#app{position:absolute;inset:0;background:#0B0B0D;color:#F5F5F7;padding:70px 20px 0;box-sizing:border-box}
#app h1{font-size:34px;margin:0 0 18px}.card{background:#1C1C1F;border-radius:16px;height:110px;margin-bottom:14px}
.btn{position:absolute;bottom:110px;left:20px;right:20px;height:56px;border-radius:16px;background:#FF4B1F}
#video{position:absolute;inset:0;background:url(frames/f_0087.png) center/cover}
img{position:absolute}
</style></head><body><div id="stage"><div id="app"><h1>Rides</h1><div class="card"></div><div class="card"></div><div class="card"></div><div class="btn"></div></div><div id="video"></div></div>
<script>
const W = 440, H = 956, TYRE = { x: 0.17, y: 0.6 }, size = W * 0.8;
const PUFFS = [
  [0, 0, -0.1, -0.05, 0.25, 1.6, 0, 30, 0.95], [1, 60, 0.15, -0.18, 0.3, 2, 40, -25, 0.9], [2, 120, -0.05, -0.35, 0.3, 2.4, 80, 20, 0.9],
  [0, 170, 0.4, -0.3, 0.35, 2.6, 120, -20, 0.88], [2, 200, 0.75, -0.15, 0.4, 2.6, 330, 18, 0.9], [1, 220, 0.25, 0.15, 0.35, 2.4, 200, 25, 0.88], [2, 260, 0.6, -0.05, 0.4, 2.8, 260, -15, 0.85],
  [0, 300, 0.1, -0.6, 0.4, 3, 300, 15, 0.85], [1, 340, 0.55, -0.55, 0.45, 3, 20, -12, 0.85], [2, 380, 0.45, 0.3, 0.45, 3, 90, 12, 0.85],
  [0, 420, -0.05, 0.3, 0.45, 2.8, 150, -10, 0.85], [1, 460, 0.7, 0.35, 0.5, 3.2, 230, 10, 0.85]];
const els = PUFFS.map(([img]) => { const e = document.createElement('img'); e.src = `smoke-${img + 1}.png`; e.style.width = e.style.height = size + 'px';
  e.style.left = TYRE.x * W - size / 2 + 'px'; e.style.top = TYRE.y * H - size / 2 + 'px'; document.getElementById('stage').appendChild(e); return e; });
const ease = (x) => 1 - Math.pow(1 - x, 3), clamp = (x, a, b) => Math.min(Math.max(x, a), b);
window.at = (t) => {
  PUFFS.forEach(([, delay, dx, dy, s0, s1, rot, spin, peak], i) => {
    const local = t - delay, e = els[i];
    if (local <= 0) { e.style.opacity = 0; return; }
    const p = ease(Math.min(local / 1100, 1)), clearing = clamp((t - 750) / (1600 - 750), 0, 1);
    e.style.opacity = peak * Math.min(local / 140, 1) * (1 - clearing);
    e.style.transform = `translateX(${dx * W * p}px) translateY(${dy * H * p}px) scale(${s0 + (s1 - s0) * p}) rotate(${rot + spin * p}deg)`;
  });
  document.getElementById('video').style.opacity = 1 - clamp((t - 680) / 150, 0, 1);
  const s = t < 680 ? 1.03 : 1.03 - 0.03 * ease(clamp((t - 680) / 850, 0, 1));
  document.getElementById('app').style.transform = `scale(${s})`;
};
window.ready = Promise.all(els.map((e) => e.decode()));
</script></body></html>
