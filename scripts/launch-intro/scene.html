<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { Pass, FullScreenQuad } from 'three/addons/postprocessing/Pass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { buildSportBike, WB, R_REAR, R_FRONT } from './bike.js';

// A riderless red and black sport bike in a dark studio: close-up, pull back, a
// stationary burnout in thick tyre smoke, a wheelie, the smoke clears and the
// camera ends exactly where it started, so the video also loops.
const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 1080), H = +(q.get('h') || 2346);
// Sub-frames averaged into each frame: real motion blur (a 180° shutter) and anti-aliasing.
const MB = Math.max(1, +(q.get('mb') || 12));
const SHUTTER = 0.5 / 60;
// Optional reframing for other aspect ratios: lens scale and a sideways/vertical frame shift.
const FOVK = +(q.get('fovk') || 1), OX = +(q.get('ox') || 0), OY = +(q.get('oy') || 0);

// ---------- timeline (seconds) ----------
const DURATION = 4.75;
const BURN_FROM = 0.55, BURN_TO = 2.6;          // rear tyre spinning against the front brake
const WHEELIE_FROM = 2.6, WHEELIE_TOP = 2.98, WHEELIE_DOWN = 3.28, LANDS = 3.66;
const WHEELIE_DEG = 38;
const TRAVEL = 4 * (2 * Math.PI / 5) * R_FRONT;  // ~1.5 m; whole turns of the 5-spoke wheels so the last frame matches the first
const CLEAR_FROM = 3.2, CLEAR_TO = 4.4;        // the smoke thins out and is gone
window.DURATION = DURATION;

// ---------- helpers ----------
const clamp = (x, a, b) => Math.min(Math.max(x, a), b);
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeOutCubic = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
const easeInOutCubic = (x) => { x = clamp(x, 0, 1); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
function rng(seed) { let x = seed >>> 0; return () => (x = (x * 1664525 + 1013904223) >>> 0) / 4294967296; }
function halton(i, b) { let f = 1, r = 0; while (i > 0) { f /= b; r += f * (i % b); i = Math.floor(i / b); } return r; }

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ACES (as three.js applies it) crushes darks; find the input that comes out as the splash colour.
function acesPreimage(hex) {
  const target = new THREE.Color(hex);
  const fit = (v) => (v * (v + 0.0245786) - 0.000090537) / (v * (0.983729 * v + 0.432951) + 0.238081);
  const solve = (L) => { let lo = 0, hi = 1; for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if (fit(m) < L) lo = m; else hi = m; } return 0.6 * lo; };
  return new THREE.Color(solve(target.r), solve(target.g), solve(target.b));
}
const BG = acesPreimage('#0B0B0D');
const WALL = new THREE.Color('#1c1d24'), WALL_GLOW = 0.2;
// where the floor fades out it matches the bottom of the backdrop, so there's no horizon line
const FLOOR_FAR = BG.clone().add(WALL.clone().multiplyScalar(WALL_GLOW));
const scene = new THREE.Scene();
scene.background = BG.clone();
scene.fog = new THREE.Fog(BG.clone(), 14, 45);
const camera = new THREE.PerspectiveCamera(34, W / H, 0.05, 200);

// ---------- studio reflections: softboxes in a black room ----------
{
  const env = new THREE.Scene();
  env.background = new THREE.Color('#000000');
  const box = (w, h, pos, look, intensity, color = '#ffffff') => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(intensity), side: THREE.DoubleSide }));
    m.position.set(...pos);
    m.lookAt(...look);
    env.add(m);
  };
  box(6, 2.2, [0, 6, 0], [0, 0, 0], 1.5);                 // overhead softbox
  box(0.6, 5, [-5, 2.5, -3], [0, 1, 0], 1.6, '#cfdcff');  // tall strips
  box(0.6, 5, [4, 2.5, -5], [0, 1, 0], 1.4);
  box(5, 2.5, [5, 1.8, 4], [0, 1, 0], 0.25);              // big soft fill, low so the sides stay dark
  // long thin strip lights: crisp lines that run along the paint, as in a car studio
  box(12, 0.16, [0, 5, 1.3], [0, 0, 1.3], 5);
  box(12, 0.16, [0, 5, -1.3], [0, 0, -1.3], 5);
  box(28, 0.2, [0, 1.6, 6], [0, 1.6, 0], 3.5);
  box(28, 0.2, [0, 1.6, -6], [0, 1.6, 0], 2.5);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(env, 0.015).texture;
  scene.environmentIntensity = 0.6;
}

// ---------- bike ----------
const bike = buildSportBike({ anisotropy: renderer.capabilities.getMaxAnisotropy() });
const { body, rearWheel, frontWheel } = bike;
const beam = new THREE.SpotLight('#eef3ff', 0, 40, 0.38, 0.6, 1.4);
beam.position.copy(bike.headlight);
const beamTarget = new THREE.Object3D();
beamTarget.position.set(10, -0.9, 0);
body.add(beam, beamTarget);
beam.target = beamTarget;
const tailGlow = new THREE.PointLight('#ff1a12', 0, 3, 2);
tailGlow.position.copy(bike.tailLight);
body.add(tailGlow);
bike.led.emissiveIntensity = 2.6;
bike.tft.emissiveIntensity = 0.6;

// rig: position → yaw about the front tyre (the rear steps out) → roll → wheelie about the rear tyre → body
const bikeRoot = new THREE.Group();
const yawG = new THREE.Group();
const rollG = new THREE.Group();
const pivot = new THREE.Group();
yawG.position.set(WB / 2, 0, 0);
rollG.position.set(-WB / 2, 0, 0);
pivot.position.set(-WB / 2, 0, 0);
body.position.set(WB / 2, 0, 0);
pivot.add(body);
rollG.add(pivot);
yawG.add(rollG);
bikeRoot.add(yawG);
scene.add(bikeRoot);

// A tileable grey noise for the lit floor. One tile is exactly TRAVEL metres, for the loop.
function concreteTexture() {
  const N = 512, c = document.createElement('canvas');
  c.width = c.height = N;
  const g = c.getContext('2d'), img = g.createImageData(N, N), r = rng(11);
  const octave = (cells) => {
    const lat = Array.from({ length: cells * cells }, r);
    const at = (i, j) => lat[(((j % cells) + cells) % cells) * cells + (((i % cells) + cells) % cells)];
    return (x, y) => {
      const fx = (x / N) * cells, fy = (y / N) * cells, ix = Math.floor(fx), iy = Math.floor(fy);
      const sx = (fx - ix) ** 2 * (3 - 2 * (fx - ix)), sy = (fy - iy) ** 2 * (3 - 2 * (fy - iy));
      return (at(ix, iy) * (1 - sx) + at(ix + 1, iy) * sx) * (1 - sy) + (at(ix, iy + 1) * (1 - sx) + at(ix + 1, iy + 1) * sx) * sy;
    };
  };
  const octs = [3, 6, 12, 24, 48, 96].map(octave);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    let v = 0, a = 0.5, sum = 0;
    for (const o of octs) { v += a * o(x, y); sum += a; a *= 0.6; }
    const b = Math.round(255 * clamp(0.6 + (v / sum - 0.5) * 1.5, 0, 1)), i = (y * N + x) * 4;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = b; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(400 / TRAVEL, 400 / TRAVEL);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
// Soft contact shadows where the tyres meet the floor.
function contactShadow(w, d) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d).rotateX(-Math.PI / 2), new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, uniforms: { strength: { value: 0.7 } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: 'uniform float strength; varying vec2 vUv; void main(){ vec2 d = (vUv - 0.5) * 2.0; float r = dot(d, d); gl_FragColor = vec4(0.0, 0.0, 0.0, strength * exp(-r * 3.5) * (1.0 - smoothstep(0.6, 1.0, r))); }',
  }));
  m.position.y = 0.0015;
  m.renderOrder = 2;
  scene.add(m);
  return m;
}
const contactRear = contactShadow(0.8, 0.42), contactFront = contactShadow(0.62, 0.3);

// ---------- floor: a blurred mirror under a lit, see-through layer ----------
const REFLECT = 0.2;
const reflector = new Reflector(new THREE.PlaneGeometry(400, 400), {
  textureWidth: W / 2, textureHeight: H / 2, clipBias: 0.002, multisample: 4,
  shader: {
    name: 'StudioFloor',
    uniforms: { color: { value: null }, tDiffuse: { value: null }, textureMatrix: { value: null }, texel: { value: new THREE.Vector2(2 / W, 2 / H) },
      strength: { value: REFLECT }, camPos: { value: new THREE.Vector3() }, far: { value: FLOOR_FAR.clone() },
      jitter: { value: new THREE.Vector2() }, period: { value: TRAVEL } },
    vertexShader: `uniform mat4 textureMatrix; varying vec4 vUv; varying vec3 vWorld;
      void main(){ vUv = textureMatrix * vec4(position, 1.0); vec4 w = modelMatrix * vec4(position, 1.0); vWorld = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: `uniform vec3 color, camPos, far; uniform sampler2D tDiffuse; uniform vec2 texel, jitter; uniform float strength, period; varying vec4 vUv; varying vec3 vWorld;
      float h2(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      // value noise that repeats along x every px cells
      float vnoise(vec2 p, float px){
        vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
        float a = h2(vec2(mod(i.x, px), i.y)), b = h2(vec2(mod(i.x + 1.0, px), i.y));
        float c = h2(vec2(mod(i.x, px), i.y + 1.0)), d = h2(vec2(mod(i.x + 1.0, px), i.y + 1.0));
        return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
      }
      // Polished concrete. It repeats every TRAVEL metres along x, so after the launch the
      // floor under the bike looks the same and the last frame still matches the first.
      float concrete(vec2 w, float cells){
        vec2 p = w / period; float n = 0.0, amp = 0.5;
        for (int i = 0; i < 5; i++){ n += amp * vnoise(p * cells, cells); cells *= 2.0; amp *= 0.5; }
        return n / 0.97;
      }
      void main(){
        float mottle = concrete(vWorld.xz, 3.0), rough = concrete(vWorld.xz + 17.0, 6.0), speck = vnoise(vWorld.xz / period * 160.0, 160.0);
        vec2 uv = vUv.xy / vUv.w; vec3 r = vec3(0.0); float wsum = 0.0;
        float spread = 1.2 + 1.8 * rough; // rougher patches blur the reflection more
        for (int i = -3; i <= 3; i++) for (int j = -3; j <= 3; j++) {
          float w = exp(-float(i * i + j * j) / 6.0);
          r += texture2D(tDiffuse, uv + (vec2(float(i), float(j)) + jitter) * texel * spread).rgb * w; wsum += w; }
        r /= wsum;
        vec3 v = normalize(camPos - vWorld);
        float fres = strength * (0.55 + 0.45 * pow(1.0 - v.y, 3.0)) * (1.3 - 0.7 * rough);
        vec3 col = color * (0.7 + 0.6 * mottle) * (0.9 + 0.2 * speck) + r * fres;
        gl_FragColor = vec4(mix(col, far, smoothstep(8.0, 30.0, distance(vWorld, camPos))), 1.0);
      }`,
  },
});
reflector.material.uniforms.color.value = acesPreimage('#0c0c0e');
reflector.rotation.x = -Math.PI / 2;
scene.add(reflector);
// Lights and shadows on the floor, added over the mirror.
const litFloor = new THREE.Mesh(new THREE.PlaneGeometry(400, 400).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: '#0c0c0e', map: concreteTexture(), roughness: 0.6, metalness: 0, envMapIntensity: 0, fog: false, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
litFloor.position.y = 0.0008;
litFloor.receiveShadow = true;
scene.add(litFloor);
{
  const render = reflector.onBeforeRender;
  reflector.onBeforeRender = function (...a) { litFloor.visible = false; render.apply(this, a); litFloor.visible = true; };
}

// ---------- backdrop: dark, with a soft glow along the far floor line ----------
const backdrop = new THREE.Mesh(new THREE.SphereGeometry(120, 64, 32), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { bg: { value: BG.clone() }, wall: { value: WALL.clone() }, glow: { value: WALL_GLOW } },
  vertexShader: 'varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `uniform vec3 bg, wall; uniform float glow; varying vec3 vDir;
    float rand(vec2 c){ return fract(sin(dot(c, vec2(12.9898,78.233))) * 43758.5453); }
    void main(){ vec3 d = normalize(vDir);
      vec3 col = bg + wall * exp(-max(d.y, 0.0) * 5.0) * glow;
      col += (rand(gl_FragCoord.xy) - 0.5) * 0.002;
      gl_FragColor = vec4(col, 1.0); }`,
}));
scene.add(backdrop);

// ---------- studio lights (they follow the bike) ----------
scene.add(new THREE.HemisphereLight('#5a6070', '#0b0b0d', 0.12));
const key = new THREE.SpotLight('#f4f6ff', 4, 0, 0.5, 1, 0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 2; key.shadow.camera.far = 14;
key.shadow.bias = -0.0003; key.shadow.normalBias = 0.02;
key.shadow.radius = 6;
scene.add(key, key.target);
const rimCool = new THREE.SpotLight('#9db8ff', 6, 9.5, 0.3, 0.8, 0);
scene.add(rimCool, rimCool.target);
const rimWarm = new THREE.SpotLight('#ff5a4a', 3.5, 8.5, 0.28, 0.8, 0);
scene.add(rimWarm, rimWarm.target);

// ---------- motion ----------
function wheelieDeg(t) {
  if (t < WHEELIE_FROM) return 0;
  if (t < WHEELIE_TOP) return WHEELIE_DEG * easeOutCubic((t - WHEELIE_FROM) / (WHEELIE_TOP - WHEELIE_FROM));
  if (t < WHEELIE_DOWN) return WHEELIE_DEG + 2.5 * Math.sin(((t - WHEELIE_TOP) / (WHEELIE_DOWN - WHEELIE_TOP)) * Math.PI);
  if (t < LANDS) return WHEELIE_DEG * (1 - easeInOutCubic((t - WHEELIE_DOWN) / (LANDS - WHEELIE_DOWN)));
  const b = t - LANDS;
  return b < 0.3 ? -1.6 * Math.sin((b / 0.3) * Math.PI) * (1 - b / 0.3) : 0; // forks dip as it lands
}
const travel = (t) => TRAVEL * easeInOutCubic((t - WHEELIE_FROM) / (LANDS + 0.25 - WHEELIE_FROM));
// burnout: how hard the rear tyre is spinning (0..1); the rear steps out a little and the bike shakes
const burn = (t) => smooth(BURN_FROM, BURN_FROM + 0.3, t) * (1 - smooth(BURN_TO - 0.05, BURN_TO + 0.2, t));
const yawDeg = (t) => burn(t) * (2.2 * Math.sin((t - BURN_FROM) * 3.1) + 0.8 * Math.sin((t - BURN_FROM) * 7.3));
const shake = (t) => burn(t) * (Math.sin(t * 173) * 0.5 + Math.sin(t * 241 + 1) * 0.5);
// Rear tyre angle: spun during the burnout, rolled during the launch. Scaled so it ends on a whole
// number of spoke steps, then the last frame matches the first.
const SPIN = 60; // rad/s at full burnout: road speed, so with motion blur the spokes smear like a real one
const spinTable = (() => {
  const n = Math.ceil(DURATION * 600), out = new Float64Array(n + 1);
  for (let i = 1; i <= n; i++) out[i] = out[i - 1] + (SPIN * burn((i - 0.5) / 600)) / 600;
  const step = (2 * Math.PI) / 5, roll = TRAVEL / R_REAR, total = out[n] + roll;
  const fix = (Math.round(total / step) * step - roll) / out[n];
  for (let i = 0; i <= n; i++) out[i] *= fix;
  return out;
})();
const spinAt = (t) => spinTable[clamp(Math.round(t * 600), 0, spinTable.length - 1)];
function rearContact(t) {
  const x = travel(t), yaw = THREE.MathUtils.degToRad(yawDeg(t));
  return new THREE.Vector3(x + WB / 2 - WB * Math.cos(yaw), 0, WB * Math.sin(yaw));
}

// ---------- tyre smoke: puffs thrown off the rear tyre, raymarched as one volume ----------
const PUFF_N = 64;
const PUFFS = (() => {
  const r = rng(7), out = [];
  for (let i = 0; i < PUFF_N; i++) {
    const birth = BURN_FROM + 0.1 + ((BURN_TO + 0.3 - BURN_FROM - 0.1) * (i + r() * 0.8)) / PUFF_N;
    // 0 = straight back; mostly fans out to the far (left) side, away from the camera
    const side = r() < 0.82 ? -1 : 1, a = Math.pow(r(), 0.85) * (side < 0 ? 1.75 : 0.6) * side;
    const speed = 2 + r() * 2.6;
    out.push({
      birth, src: rearContact(birth),
      v: new THREE.Vector3(-Math.cos(a) * speed, 0.35 + r() * 1.1, Math.sin(a) * speed * 0.85),
      tau: 0.28 + r() * 0.25, rise: 0.22 + r() * 0.5,
      drift: new THREE.Vector3(0.05 + r() * 0.2, 0, -0.1 - r() * 0.15),
      r0: 0.12 + r() * 0.1, grow: 0.55 + r() * 0.7, amp: 0.8 + r() * 0.5,
    });
  }
  return out;
})();
function smokeAt(t) {
  const clear = smooth(CLEAR_FROM, CLEAR_TO, t);
  const pos = [], amp = [], ages = [], lo = new THREE.Vector3(1e9, 1e9, 1e9), hi = new THREE.Vector3(-1e9, -1e9, -1e9);
  for (const p of PUFFS) {
    const age = t - p.birth;
    if (age <= 0 || clear >= 1) continue;
    const rad = p.r0 + p.grow * Math.pow(age, 0.62) * (1 + 0.35 * clear);
    const c = p.src.clone()
      .addScaledVector(p.v.clone().setY(0), p.tau * (1 - Math.exp(-age / p.tau)))
      .addScaledVector(p.drift, age);
    c.y = Math.max(p.v.y * p.tau * (1 - Math.exp(-age / p.tau)) + p.rise * Math.pow(age, 1.3) + 0.4 * clear * clear, rad * 0.42);
    const a = p.amp * smooth(0, 0.12, age) * Math.pow(0.55 / (0.55 + rad), 1.1);
    pos.push(new THREE.Vector4(c.x, c.y, c.z, rad));
    amp.push(a);
    ages.push(age);
    lo.min(c.clone().subScalar(rad)); hi.max(c.clone().addScalar(rad));
  }
  lo.y = Math.max(lo.y, 0);
  return { pos, amp, ages, lo, hi, erode: 0.5 + 0.6 * clear, fade: 1 - clear };
}

const SMOKE_GLSL = /* glsl */`
uniform sampler2D tDepth;
uniform mat4 projInv, camWorld;
uniform vec3 camPos;
uniform float time, erode, fade, haze, seed;
uniform int count, steps;
uniform vec4 puffP[${PUFF_N}];
uniform float puffA[${PUFF_N}];
uniform float puffAge[${PUFF_N}];
uniform vec3 boxLo, boxHi;
uniform vec3 keyDir, keyCol, backDir, backCol, ambCol;
uniform vec3 headPos, headDir, headCol;
uniform vec3 tailPos, tailCol;
uniform float reflectAmt;
varying vec2 vUv;
layout(location = 0) out vec4 oSmoke; // light scattered by the smoke, and how much of what's behind gets through
layout(location = 1) out vec4 oFloor; // the smoke's reflection added to the floor, and the floor's shading under it
layout(location = 2) out vec4 oDist;  // how far away the smoke is, for the depth of field

vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+10.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));

  contactFront.material.uniforms.strength.value = 0.7 * Math.exp(-lift / 0.07);

  // focus on what the camera is looking at
  dof.uniforms.focus.value = camera.position.distanceTo(tgt);
  dof.uniforms.ppr.value = H / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
  dof.uniforms.rot.value = sub * 2.39996;
}

const syncPx = new Uint16Array(4);
const sync = () => renderer.readRenderTargetPixels(accumRT, 0, 0, 1, 1, syncPx);
window.renderAt = function (t, quality = 0.95) {
  pose(t);
  renderSmoke();
  renderer.setRenderTarget(accumRT);
  renderer.setClearColor(0x000000, 0);
  renderer.clear();
  sync();
  for (let i = 0; i < MB; i++) {
    // sub-frames spread across an open shutter centred on t, each nudged by a fraction of a pixel
    const st = MB > 1 ? clamp(t + ((i + 0.5) / MB - 0.5) * SHUTTER, 0, DURATION) : t;
    pose(st, MB > 1 ? halton(i + 1, 2) - 0.5 : 0, MB > 1 ? halton(i + 1, 3) - 0.5 : 0, i);
    composer.render();
    accumMat.uniforms.tSrc.value = composer.readBuffer.texture;
    accumMat.uniforms.weight.value = 1 / MB;
    renderer.setRenderTarget(accumRT);
    renderer.autoClear = false;
    accumQuad.render(renderer);
    renderer.autoClear = true;
    sync();
  }
  finishMat.uniforms.seed.value = Math.round(t * 60) % Math.round(DURATION * 60);
  renderer.setRenderTarget(null);
  finishQuad.render(renderer);
  return renderer.domElement.toDataURL(quality === 'png' ? 'image/png' : 'image/jpeg', quality === 'png' ? undefined : quality);
};
window.sceneReady = true;
</script>
</body>
