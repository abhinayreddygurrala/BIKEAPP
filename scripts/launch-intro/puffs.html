<!doctype html>
<html><head><meta charset="utf-8" /></head>
<body style="margin:0;background:#0B0B0D">
<script>
// Tyre-smoke puffs (512x512 PNG with alpha) for the app's smoke transition.
function rng(seed) { let x = seed >>> 0; return () => (x = (x * 1664525 + 1013904223) >>> 0) / 4294967296; }
function blob(g, x, y, r, rgba) {
  const grad = g.createRadialGradient(x, y, 0, x, y, r);
  grad.addColorStop(0, rgba);
  grad.addColorStop(1, rgba.replace(/[\d.]+\)$/, '0)'));
  g.fillStyle = grad;
  g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
}
window.puff = function (seed) {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const g = c.getContext('2d'), rand = rng(seed);
  // density: soft blobs, thickest in the middle
  for (let i = 0; i < 150; i++) {
    const a = rand() * Math.PI * 2, r = Math.pow(rand(), 0.7) * 150;
    blob(g, 256 + Math.cos(a) * r * 1.1, 256 + Math.sin(a) * r * 0.9, 30 + rand() * 90, `rgba(255,255,255,${0.09 + rand() * 0.1})`);
  }
  // feather the outside
  g.globalCompositeOperation = 'destination-in';
  const mask = g.createRadialGradient(256, 256, 110, 256, 256, 252);
  mask.addColorStop(0, 'rgba(0,0,0,1)');
  mask.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = mask; g.fillRect(0, 0, 512, 512);
  // colour it like tyre smoke lit from above, keeping the density as alpha
  g.globalCompositeOperation = 'source-atop';
  const shade = g.createLinearGradient(0, 70, 0, 450);
  shade.addColorStop(0, '#e4dfda');
  shade.addColorStop(0.55, '#aba39d');
  shade.addColorStop(1, '#776e6a');
  g.fillStyle = shade; g.fillRect(0, 0, 512, 512);
  // billows: darker hollows and lit tops
  for (let i = 0; i < 26; i++) {
    const a = rand() * Math.PI * 2, r = Math.pow(rand(), 0.8) * 140;
    blob(g, 256 + Math.cos(a) * r, 256 + Math.sin(a) * r, 25 + rand() * 50, 'rgba(84,76,72,0.16)');
  }
  for (let i = 0; i < 22; i++) {
    const a = rand() * Math.PI * 2, r = Math.pow(rand(), 0.8) * 130;
    blob(g, 256 + Math.cos(a) * r, 236 + Math.sin(a) * r * 0.8, 20 + rand() * 45, 'rgba(244,240,236,0.14)');
  }
  return c.toDataURL('image/png');
};
window.ready = true;
</script>
</body></html>
